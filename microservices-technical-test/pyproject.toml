[project]
name = "microservices-technical-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["application", "domain", "infrastructure", "ioc"]

[tool.uv.workspace]
members = [
    "independent_producer",
    "independent_consumer",
]
