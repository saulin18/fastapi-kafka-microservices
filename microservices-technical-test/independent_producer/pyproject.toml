[project]
name = "independent-producer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.4.0",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
